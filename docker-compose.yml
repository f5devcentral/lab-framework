services:
  lab-framework-core:
    image: ghcr.io/f5devcentral/lab-framework-core:latest
    pull_policy: always
    # build:
    #   dockerfile: ./Dockerfile
    restart: always
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./.env:/app/.env"

volumes:
  cache:
    driver: local

networks:
  default:
    name: lab-framework
    driver: bridge
